prometheus:
  server:
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - "prometheus.home.kyoku.dev"
      tls:
        - secretName: prometheus-server-tls
          hosts:
            - prometheus.home.kyoku.dev
      ingressClassName: nginx

grafana:
  grafana.ini:
    server:
      domain: grafana.home.kyoku.dev
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - "grafana.home.kyoku.dev"
    tls:
      - secretName: grafana-server-tls
        hosts:
          - grafana.home.kyoku.dev
    ingressClassName: nginx
